<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>RH proof expression explorer</title>
<style>
:root { color-scheme: dark; font: 14px/1.5 system-ui, sans-serif; background: #111619; color: #e5eaeb }
* { box-sizing: border-box }
body { margin: 0; min-height: 100vh; display: grid; grid-template-columns: 290px minmax(0,1fr) }
aside { border-right: 1px solid #354044; padding: 22px 18px; overflow-wrap: anywhere }
main { padding: 22px clamp(16px,3vw,48px); min-width: 0 }
h1 { font-size: 22px; line-height: 1.1; font-weight: 650; margin: 4px 0 18px }
h2 { font-size: 17px; margin: 20px 0 12px }
h3 { margin: 0 0 8px; font-size: 15px }
small, .muted { color:#a9b8bc } p { max-width: 70ch }
button, input { font: inherit }
button { border: 1px solid #45575d; border-radius: 7px; background: #1a292e; color: #e5eaeb; padding: 7px 11px; cursor: pointer; text-align: left }
button:hover,button:focus { border-color: #90d8cf; outline: none }
button:disabled { opacity: .65; cursor: wait }
input { border: 1px solid #45575d; border-radius: 7px; background: #0b1114; color: #f2f2f2; padding: 9px 10px; width: 100% }
.roots, .matches { display:grid; gap:7px; margin-top:10px }
.roots button,.matches button { overflow-wrap: anywhere }
.mono, code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; overflow-wrap: anywhere }
.eyebrow { color:#8fd2c5; letter-spacing:.08em; font-size:11px; text-transform: uppercase }
.subtitle { color:#a7b7bb; margin: 5px 0 22px }
.node { border-left: 2px solid #4d7073; padding: 6px 0 6px 17px; margin: 8px 0 0 10px; min-width:0 }
.node-head { display:flex; gap:8px; flex-wrap:wrap; align-items:center }
.node-head button { max-width: 100%; overflow-wrap: anywhere }
.kind { border-radius:5px; padding:2px 7px; background:#264046; color:#aadacf; font-size:12px }
.edge { color:#a9b8bc; font-size:12px }
.branch { margin: 14px 0; border: 1px solid #364548; padding: 14px 15px 16px; border-radius: 9px }
pre { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 250px; overflow:auto; background: #0b1215; border-radius:7px; padding:10px; font-size:12px }
details { margin-top: 8px } summary { cursor:pointer; color:#c8dbde }
.notice { color:#b6c6cb; font-size:12px; max-width:70ch; padding: 10px 0 }
.error { color:#ffaaaa }
#back { margin-bottom:10px }
@media(max-width: 780px) { body{display:block} aside { border-right:none; border-bottom:1px solid #354044; padding:15px } main{padding:16px} .roots {grid-template-columns:repeat(2,minmax(0,1fr))} }
</style>
</head>
<body>
<aside>
<div class="eyebrow">Kernel expression graph</div>
<h1>RH proof explorer</h1>
<input id="search" placeholder="Prefix search for a declaration" aria-label="Search declaration prefix">
<div id="matches" class="matches" aria-live="polite"></div>
<h2>Five theorem roots</h2>
<div id="roots" class="roots"></div>
<p id="status" class="notice"></p>
</aside>
<main>
<button id="back" hidden>Back</button>
<div class="eyebrow">Lazy proof inspection</div>
<h2 id="heading">Select a theorem</h2>
<p class="subtitle" id="subtitle">Expand individual expressions rather than rendering millions of nodes at once.</p>
<div id="tree"></div>
</main>
<script>
'use strict';
const $ = id => document.getElementById(id);
const request = async url => {
  const resp = await fetch(url);
  const obj = await resp.json();
  if (!resp.ok) throw Error(obj.error || `${resp.status}`);
  return obj;
};
const node = (tag, text, cls) => {
  const el = document.createElement(tag);
  if (text != null) el.textContent = String(text);
  if (cls) el.className = cls;
  return el;
};
const button = (text, fn) => {
  const el = node('button',text);
  el.addEventListener('click',fn);
  return el;
};
const history = [];
function showError(el, err) { el.append(node('p',err.message || String(err),'error')); }
async function chooseDeclaration(name, remember=true) {
  try {
    if (remember && $('heading').dataset.id) history.push(Number($('heading').dataset.id));
    $('back').hidden = !history.length;
    const info = await request(typeof name === 'number' ? '/api/declaration?id=' + name : '/api/declaration?name=' + encodeURIComponent(name));
    $('heading').textContent = info.name;
    $('heading').dataset.id = info.id;
    $('subtitle').textContent = `${info.kind} · exported declaration #${info.id} · click any Expr to expand only that node`;
    const tree = $('tree'); tree.replaceChildren();
    const count = info.expression_roots.length;
    info.expression_roots.forEach((id,i) => {
      const role = i===0?'checked type':(i===1&&['thm','def','opaque'].includes(info.kind)?'proof / value':`recursor rule ${i}`);
      const branch = node('section',null,'branch');
      branch.append(node('h3',`${role} · Expr #${id}`));
      branch.append(exprButton(id));
      tree.append(branch);
    });
    if (info.mutual_or_group.length) {
      const d=node('details'); d.append(node('summary',`Mutual/group members (${info.mutual_or_group.length})`));
      d.append(node('pre',JSON.stringify(info.mutual_or_group,null,2)));
      tree.append(d);
    }
    const raw=node('details'); raw.append(node('summary','Raw exported declaration record'));
    raw.append(node('pre',JSON.stringify(info.raw,null,2))); tree.append(raw);
  } catch(err) { $('tree').replaceChildren(); showError($('tree'),err); }
}
function exprButton(id, role='root') {
  const wrap = node('div',null,'node');
  const head = node('div',null,'node-head');
  const toggle = button(`▶ Expr #${id}`,async () => {
    if (wrap.dataset.open==='true') { body.hidden=true; wrap.dataset.open='false'; toggle.textContent=`▶ Expr #${id}`; return; }
    if (wrap.dataset.loaded==='true') { body.hidden=false; wrap.dataset.open='true'; toggle.textContent=`▼ Expr #${id}`; return; }
    toggle.disabled=true;
    try {
      const info=await request('/api/expression?id='+id);
      wrap.dataset.loaded='true'; wrap.dataset.open='true';
      toggle.textContent=`▼ Expr #${id}`;
      head.append(node('span',info.kind,'kind'));
      if (info.reference) {
        const ref=info.reference;
        if (ref.defined) head.append(button(`↗ ${ref.name}`,()=>chooseDeclaration(ref.name_id)));
        else head.append(node('span',`unresolved ${ref.name || ref.name_id}`,'error'));
      }
      for (const edge of info.children) body.append(exprButton(edge.id,edge.role));
      const d=node('details'); d.append(node('summary','Exact exporter payload'));
      d.append(node('pre',JSON.stringify(info.raw,null,2))); body.append(d);
      body.hidden=false;
    } catch(err) { showError(body,err); body.hidden=false; }
    finally { toggle.disabled=false; }
  });
  const body = node('div'); body.hidden=true;
  head.append(node('span',role,'edge'),toggle);
  wrap.append(head,body);
  return wrap;
}
$('back').addEventListener('click',()=>{const prev=history.pop(); if(prev) chooseDeclaration(prev,false); $('back').hidden=!history.length;});
let querySerial=0;
$('search').addEventListener('input',async e=>{
  const q=e.target.value.trim(); const seq=++querySerial;
  const target=$('matches'); target.replaceChildren();
  if (!q) return;
  try {
    const {matches}=await request('/api/find?q='+encodeURIComponent(q));
    if(seq!==querySerial)return;
    for (const item of matches) target.append(button(item.name+' (#'+item.id+')',()=>chooseDeclaration(item.id)));
    if (!matches.length) target.append(node('small','No prefix matches'));
  } catch(err) { if(seq===querySerial) showError(target,err); }
});
(async()=>{
  try {
    const info=await request('/api/manifest');
    const roots=$('roots');
    info.roots.forEach(name=>roots.append(button(name,()=>chooseDeclaration(name))));
    $('status').textContent=`${info.expression_count.toLocaleString()} expression nodes · ${info.declaration_count.toLocaleString()} declarations. Export hash (decompressed NDJSON): ${info.decompressed_ndjson_sha256}. This is not kernel verification.`;
    if(info.roots.length) await chooseDeclaration(info.roots[0],false);
  } catch(err) { showError($('roots'),err); }
})();
</script>
</body>
</html>
