name: RH upstream Lean Graph adapter

on:
  pull_request:
    paths:
      - tools/rh_lean_graph.py
      - tools/test_rh_lean_graph.py
      - tools/RH_GRAPH_EXPLORER.md
      - .github/workflows/rh-lazy-graph.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream-adapter-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Test RH source wrapper (no Lean build)
        run: python3 -m unittest discover -s tools -p test_rh_lean_graph.py -v
      - name: Generate driver from the pinned upstream Lean Graph extractor
        run: |
          python3 tools/rh_lean_graph.py --depth 2 --output analysis/RHLeanGraph.lean
          python3 - <<'PY'
          from pathlib import Path
          s=Path('analysis/RHLeanGraph.lean').read_text()
          assert s.count('#eval serializeAndWriteToFile') == 5
          assert 'import Main' in s
          print('Pin checked and five-root Lean driver generated')
          PY
