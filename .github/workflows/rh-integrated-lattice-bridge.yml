name: Source-check integrated arithmetic lattice bridge

on:
  pull_request:
    paths:
      - 'src/Formalism/SizeWindowBrackets/ChainSlopeWindows/SlopeInequalityOfLatticesIntegrated.lean'
      - 'src/Formalism/SizeWindowBrackets/ChainSlopeWindows/SlopeInequalityOfFamilyIntegrated.lean'
      - '.github/workflows/rh-integrated-lattice-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rh-integrated-lattice-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lattice-bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up pinned Lean toolchain
        uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          mk_all-check: false
          use-mathlib-cache: false
          use-github-cache: false
      - name: Retrieve official Mathlib cache with retries
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if lake exe cache get; then exit 0; fi
            sleep $((attempt * 8))
          done
          exit 1
      - name: Check actual source-to-integrated bridge
        shell: bash
        run: |
          set -euo pipefail
          lake build Formalism.SizeWindowBrackets.ChainSlopeWindows.SlopeInequalityOfFamilyIntegrated
