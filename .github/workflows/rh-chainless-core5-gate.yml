name: RH CoreNoChain/Core5 bridge proof gate

on:
  pull_request:
    paths:
      - src/Development/AbelianVarietyTheory/Proofs/IwasawaDecomposition/MovedFiniteDatumFourierExpansionChainless.lean
      - tools/RHChainlessCore5Check.lean
      - .github/workflows/rh-chainless-core5-gate.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rh-chainless-core5-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Audit all seven source theorem statements and donor import closure
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '4ee985bc90444f45fb805d5221fb2d52b55eff75' }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          import sys
          sys.path.insert(0, "tools")
          from import_closure import load_source, transitive_modules
          source = "src/Development/AbelianVarietyTheory/Proofs/IwasawaDecomposition/MovedFiniteDatumFourierExpansionChainless.lean"
          candidate = Path(source).read_text(encoding="utf-8")
          original = subprocess.check_output(
              ["git", "show", os.environ["BASE_SHA"] + ":" + source], text=True
          )
          old_names = (
              "models_at_record_core_nc",
              "thetaVector_eq_sum_heisenberg_of_core_without_chain",
              "io_eq_phase_smul_core_nc",
              "thetaKO_eq_short_series_core_nc",
              "class_scalar_value_core_nc",
              "coefMap_norm_equivariant_basis_nc",
              "isPair_record_core_nc",
          )
          def theorem_header(text, name):
              first = text.index("theorem " + name + " : ")
              last = text.index(":= by", first)
              return text[first:last].strip()
          for name in old_names:
              assert theorem_header(original, name) == theorem_header(candidate, name), name
              body = candidate[candidate.index("theorem " + name + " : "):]
              body = body[:body.index("\nend ")]
              assert "CoreNoChain.to_core5" in body, name
          assert "theorem CoreNoChain.to_core5" in candidate
          assert "theorem CoreNoChain.of_core5" in candidate
          deps, _, warnings = load_source(Path("src"))
          if warnings:
              raise ValueError("unknown import syntax: " + str(warnings[:10]))
          donor = ("Development.AbelianVarietyTheory.Proofs.DivisorProofs."
                   "ExistsCcIsEquivAtSerOfOneMapRowOfFive")
          consumer = ("Development.AbelianVarietyTheory.Proofs.IwasawaDecomposition."
                      "MovedFiniteDatumFourierExpansionChainless")
          assert donor in deps[consumer], "donor import absent"
          assert consumer not in transitive_modules(deps, donor), "transitive import cycle"
          print("Preserved seven source headers; explicit record bridges; no donor import cycle")
          PY

  lean-proof:
    needs: source-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install checksum-pinned elan / Lean 4.33.1
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz \
            --output "$RUNNER_TEMP/elan.tar.gz"
          printf '%s  %s\n' \
            '42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63' \
            "$RUNNER_TEMP/elan.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/elan-init" -y --default-toolchain none --no-modify-path
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.33.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Capture modified source and manifest identity
        run: |
          set -euo pipefail
          mkdir -p analysis
          python3 tools/rh_ci_identity.py --root . \
            --output analysis/rh-chainless-core5-input-identity.json
      - name: Restore pinned Mathlib compiled dependency cache
        run: |
          set -euo pipefail
          lake exe mathlib/cache get
          git diff --quiet HEAD -- lakefile.toml lake-manifest.json lean-toolchain src
      - name: Re-elaborate altered source declarations
        shell: bash
        run: |
          set -euo pipefail
          lake build \
            Development.AbelianVarietyTheory.Proofs.IwasawaDecomposition.MovedFiniteDatumFourierExpansionChainless \
            2>&1 | tee analysis/rh-chainless-core5-build.log
      - name: Check all theorem declarations and axioms
        shell: bash
        run: |
          set -euo pipefail
          lake env lean tools/RHChainlessCore5Check.lean \
            2>&1 | tee analysis/rh-chainless-core5-axioms.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rh-chainless-core5-source-gate
          path: |
            analysis/rh-chainless-core5-*.log
            analysis/rh-chainless-core5-input-identity.json
          retention-days: 30
          if-no-files-found: warn
