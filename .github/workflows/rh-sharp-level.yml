name: Source-check sharp level-of-congruence error

on:
  pull_request:
    paths:
      - 'src/Formalism/SizeWindowBrackets/ChainSlopeWindows/LevelOfCongruenceIntegrated.lean'
      - 'src/Formalism/SizeWindowBrackets/ChainSlopeWindows/IntegratedLatticeArithmeticBridge.lean'
      - 'src/Formalism/SizeWindowBrackets/ChainSlopeWindows/IntegratedLatticeFamilyBridge.lean'
      - 'src/Formalism/SizeWindowBrackets/ChainSlopeWindows/IntegratedFamSlope.lean'
      - '.github/workflows/rh-sharp-level.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rh-sharp-level-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  level-error:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up pinned Lean toolchain
        uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          mk_all-check: false
          use-mathlib-cache: false
          use-github-cache: false
      - name: Retrieve pinned Mathlib cache with retries
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if lake exe cache get; then exit 0; fi
            sleep $((attempt * 8))
          done
          exit 1
      - name: Source-build actual arithmetic level proof
        shell: bash
        run: |
          set -euo pipefail
          lake build Formalism.SizeWindowBrackets.ChainSlopeWindows.LevelOfCongruenceIntegrated
          lake build Formalism.SizeWindowBrackets.ChainSlopeWindows.IntegratedLatticeArithmeticBridge
          lake build Formalism.SizeWindowBrackets.ChainSlopeWindows.IntegratedLatticeFamilyBridge
          lake build Formalism.SizeWindowBrackets.ChainSlopeWindows.IntegratedFamSlope
