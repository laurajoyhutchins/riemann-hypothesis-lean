name: RH minimization tooling tests (not proof verification)

on:
  pull_request:
    paths:
      - tools/**
      - .github/workflows/rh-minimization-tools.yml
  workflow_dispatch:

jobs:
  source-audit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools
          sparse-checkout-cone-mode: true
          filter: blob:none
          persist-credentials: false
      - name: Run all deterministic RH minimization tool unit tests
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v

  construction-atlas-experiment:
    # A separately admitted research scan. Ordinary tool PRs stay lightweight.
    if: startsWith(github.head_ref, 'research/construction-family-atlas-')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Scan actual Abelian-variety proof source for construction candidates
        run: |
          python3 tools/construction_atlas.py \
            --src src \
            --root Development/AbelianVarietyTheory/Proofs \
            --min-lines 40 \
            --min-members 2 \
            --max-groups 150 \
            --out analysis/rh-construction-family-atlas.json
      - name: Archive candidate census, not Lean verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rh-construction-family-atlas
          path: analysis/rh-construction-family-atlas.json
          if-no-files-found: warn
          retention-days: 30
