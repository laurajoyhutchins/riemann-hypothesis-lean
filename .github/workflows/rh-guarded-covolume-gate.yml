name: RH guard-parametric covolume focused Lean proof gate

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/Development/AutomorphicArithmetic/ThetaCorrespondence/ThetaPairLifts/ThirdPlaceSeries/CovolumeGuardedAssembly.lean'
      - 'checks/CovolumeGuardedAudit.lean'
      - '.github/workflows/rh-guarded-covolume-gate.yml'

permissions:
  contents: read

# This gate elaborates the real RH imports, not a mock theorem.
# A Mathlib cache does not establish independent kernel verification of RH.
env:
  LEAN_ABORT_ON_PANIC: '1'
  LAKE_ARTIFACT_CACHE: 'false'

jobs:
  source-elaboration:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Lean 4.33.1
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz \
            --output "$RUNNER_TEMP/elan.tar.gz"
          printf '%s  %s\n' \
            '42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63' \
            "$RUNNER_TEMP/elan.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/elan-init" -y --default-toolchain none --no-modify-path
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.33.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Record source and toolchain identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p analysis
          git rev-parse HEAD | tee analysis/covolume-head-sha.txt
          cat lean-toolchain | tee analysis/covolume-toolchain.txt
          git rev-parse HEAD:src/Development/AutomorphicArithmetic/ThetaCorrespondence/ThetaPairLifts/ThirdPlaceSeries/CovolumeGuardedAssembly.lean \
            | tee analysis/covolume-source-blob.txt
      - name: Fetch only pinned Mathlib compiled dependencies
        shell: bash
        run: |
          set -euo pipefail
          lake exe mathlib/cache get
          git diff --quiet HEAD -- lakefile.toml lake-manifest.json lean-toolchain src
      - name: Elaborate actual generic theorem with both specializations
        shell: bash
        run: |
          set -euo pipefail
          lake build Development.AutomorphicArithmetic.ThetaCorrespondence.ThetaPairLifts.ThirdPlaceSeries.CovolumeGuardedAssembly \
            2>&1 | tee analysis/covolume-guarded-build.log
      - name: Print original versus new theorem types and axiom dependencies
        shell: bash
        run: |
          set -euo pipefail
          lake env lean checks/CovolumeGuardedAudit.lean \
            2>&1 | tee analysis/covolume-guarded-audit.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rh-guarded-covolume-focused-lean-evidence
          path: analysis/covolume-*
          retention-days: 30
          if-no-files-found: warn
