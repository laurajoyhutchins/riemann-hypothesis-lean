name: Proof import graph fixtures

on:
  pull_request:
    paths:
      - "tools/proof_import_graph.py"
      - "tests/test_proof_import_graph.py"
      - ".github/workflows/proof-import-graph.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Sparse-checkout the graph tool and tests
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            tools
            tests
          sparse-checkout-cone-mode: true
      - name: Run source-graph fixture checks
        run: python3 -m unittest discover -s tests -v
